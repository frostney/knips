# opname pre-commit hook.
#
# Install once per fresh clone:  lefthook install
#
# Local pre-commit runs the canonical formatter (`lwpt format`) and
# re-stages any files it rewrites. The heavyweight gates — `lwpt format
# --check`, `lwpt build`, `lwpt test`, `opname probe` on a Mac — belong to
# the PR / CI flow so local commits stay fast.
#
# lwpt is expected on PATH. Point OPNAME_LWPT at another lwpt binary to
# override. Do NOT bypass with `git commit --no-verify` unless a
# maintainer explicitly authorises it.

min_version: 1.5.0

pre-commit:
  parallel: true

  commands:

    format:
      glob: "*.{pas,inc,dpr,toml}"
      run: ${OPNAME_LWPT:-lwpt} format
      stage_fixed: true
      fail_text: |
        lwpt format failed. Inspect the output above; the formatter only
        fails when it cannot parse a file. If lwpt is missing entirely
        (fresh clone), install it first — see docs/quick-start.md.
